spring.application.name=CF_DuelProject

# ─── MongoDB ───────────────────────────────────────────────────────────────────
# MONGODB_URI is REQUIRED (no fallback): a missing variable must stop the app instead of silently using another database.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:cf_duel_db}
spring.data.mongodb.auto-index-creation=true

# ─── Google OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope=email,profile



# ─── JWT ───────────────────────────────────────────────────────────────────────
# REQUIRED, no default. Must be a cryptographically strong random string (min 32 bytes; 64+ recommended).
JWT_SECRET=${JWT_SECRET}

# ─── Application URLs ──────────────────────────────────────────────────────────
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ─── Actuator (Health Check) ───────────────────────────────────────────────────
# Only expose the health endpoint — never expose env, beans, heap dump, etc.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.CF_DuelProject=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ─── Server ────────────────────────────────────────────────────────────────────
server.port=8080
# Behind the nginx container the TCP peer is the proxy. Trust X-Forwarded-For from internal proxies only, so
# per-IP rate limits apply to the real client instead of to all users at once.
server.forward-headers-strategy=native
# Disable error details in response body (prevents stack trace exposure)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# ─── Admin / tournament creation ───────────────────────────────────────────────
# Comma-separated account e-mails allowed to create tournaments (in addition to users flagged admin in the DB).
app.admin-emails=${ADMIN_EMAILS:}
# Set to false to let any verified user create tournaments.
app.tournament.admin-only=${TOURNAMENT_ADMIN_ONLY:true}
