# Used ONLY by tests that opt in with @ActiveProfiles("test").
# These values are placeholders: nothing here can reach a real database or a real OAuth provider.
# The Mongo URI points at an unused local port; tests using this profile replace every repository with a mock.
spring.data.mongodb.uri=mongodb://localhost:1/cf_duel_unit_test_never_connected
spring.data.mongodb.database=cf_duel_unit_test_never_connected
spring.data.mongodb.auto-index-creation=false
JWT_SECRET=unit-test-only-jwt-secret-unit-test-only-jwt-secret-0123456789
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
frontend.url=http://localhost:5173
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
